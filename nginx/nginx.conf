events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # upstream=<address:port> shows who answered: port 8080 is .NET, port 80 is Node (tests/e2e/run_e2e.py reads this).
  log_format abs '$remote_addr "$request" $status upstream=$upstream_addr';
  access_log /dev/stdout abs;

  upstream abs_node   { server abs-node:80; }
  upstream abs_dotnet { server abs-dotnet:8080; }

  # A request goes to .NET only when .NET answers it exactly like Node (checked by tests/e2e/run_e2e.py).
  # Everything else, including every option .NET does not support, stays in Node.

  # GET without any query string. A query string such as ?include=stats, ?expanded=1 or ?token=... goes to Node.
  map "$request_method:$args" $to_dotnet_plain_get {
    default   abs_node;
    "GET:"    abs_dotnet;
  }

  # GET /api/libraries/<id>/items with only the options .NET supports.
  map "$request_method:$args" $to_dotnet_items {
    default   abs_node;
    "GET:"    abs_dotnet;
    "~^GET:((limit|page|desc|minified)=[^&]*|sort=(addedAt|size|birthtimeMs|mtimeMs|media\.duration|media\.metadata\.(publishedYear|authorName|authorNameLF|title)))(&((limit|page|desc|minified)=[^&]*|sort=(addedAt|size|birthtimeMs|mtimeMs|media\.duration|media\.metadata\.(publishedYear|authorName|authorNameLF|title))))*$"   abs_dotnet;
  }

  server {
    listen 80;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;

    # --- Libraries (A) ---
    location = /api/libraries {
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^/api/libraries/[^/]+$ {
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Library items (C) ---
    location ~ ^/api/libraries/[^/]+/items$ {
      proxy_pass http://$to_dotnet_items;
    }

    location ~ ^/api/items/[^/]+$ {
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Me and users (B) ---
    location = /api/me {
      proxy_pass http://$to_dotnet_plain_get;
    }

    location = /api/users {
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Progress and bookmarks, reads only (D); writes and /remove-from-continue-listening stay in Node ---
    location = /api/me/progress {
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^/api/me/progress/(?!batch/)[^/]+(/(?!remove-from-continue-listening$)[^/]+)?$ {
      proxy_pass http://$to_dotnet_plain_get;
    }

    location = /api/me/bookmarks {
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^/api/me/bookmarks/[^/]+$ {
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Everything else stays in Node ---
    location / {
      proxy_pass http://abs_node;
    }
  }
}
