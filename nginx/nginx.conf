events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # upstream=<address:port> shows who answered: port 8080 is .NET, port 80 is Node (tests/e2e/run_e2e.py reads this).
  log_format abs '$remote_addr "$request" $status upstream=$upstream_addr';
  access_log /dev/stdout abs;

  upstream abs_node   { server abs-node:80; }
  upstream abs_dotnet { server abs-dotnet:8080; }

  # A request goes to .NET only when .NET answers it exactly like Node (checked by tests/e2e/run_e2e.py).
  # Everything else, including every option .NET does not support, stays in Node.

  # GET without any query string. A query string such as ?include=stats, ?expanded=1 or ?token=... goes to Node.
  map "$request_method:$args" $to_dotnet_plain_get {
    default   abs_node;
    "GET:"    abs_dotnet;
  }

  # GET /api/libraries/<id>/items with only the options .NET supports (include is accepted: rssfeed is answered,
  # share answers 501 when a share exists, other values are ignored by Node as well).
  map "$request_method:$args" $to_dotnet_items {
    default   abs_node;
    "GET:"    abs_dotnet;
    "~^GET:((limit|page|desc|minified|include)=[^&]*|sort=(addedAt|size|birthtimeMs|mtimeMs|media\.duration|media\.metadata\.(publishedYear|authorName|authorNameLF|title)))(&((limit|page|desc|minified|include)=[^&]*|sort=(addedAt|size|birthtimeMs|mtimeMs|media\.duration|media\.metadata\.(publishedYear|authorName|authorNameLF|title))))*$"   abs_dotnet;
  }

  server {
    listen 80;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;

    # The web client calls /audiobookshelf/api/... (Node's base path); other clients call /api/....
    # Both are matched. The prefix is removed before proxying: Node accepts the path without it, .NET needs it removed.

    # --- Libraries (A) ---
    location ~ ^(/audiobookshelf)?/api/libraries$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^(/audiobookshelf)?/api/libraries/[^/]+$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Library items (C) ---
    location ~ ^(/audiobookshelf)?/api/libraries/[^/]+/items$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_items;
    }

    location ~ ^(/audiobookshelf)?/api/items/[^/]+$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Me and users (B) ---
    location ~ ^(/audiobookshelf)?/api/me$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^(/audiobookshelf)?/api/users$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    # --- Progress and bookmarks, reads only (D); writes and /remove-from-continue-listening stay in Node ---
    location ~ ^(/audiobookshelf)?/api/me/progress$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^(/audiobookshelf)?/api/me/progress/(?!batch/)[^/]+(/(?!remove-from-continue-listening$)[^/]+)?$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^(/audiobookshelf)?/api/me/bookmarks$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    location ~ ^(/audiobookshelf)?/api/me/bookmarks/[^/]+$ {
      rewrite ^/audiobookshelf(/.*)$ $1 break;
      proxy_intercept_errors on;
      error_page 501 = @abs_node;
      proxy_pass http://$to_dotnet_plain_get;
    }

    # .NET answers 501 when it cannot answer a request exactly like Node (for example live share state).
    # The request is a GET, so it is simply sent again to Node.
    location @abs_node {
      proxy_pass http://abs_node;
    }

    # --- Everything else stays in Node ---
    location / {
      proxy_pass http://abs_node;
    }
  }
}
