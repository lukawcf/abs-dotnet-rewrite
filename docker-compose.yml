   services:
     abs-node:
       image: ghcr.io/advplyr/audiobookshelf:latest
       environment:
         - TZ=Pacific/Auckland
         - JWT_SECRET_KEY=${JWT_SECRET_KEY}
       volumes:
         - ./library:/audiobooks
         - ./config:/config
         - ./metadata:/metadata
     nginx:
       image: nginx:stable
       ports:
         - "8080:80"
       volumes:
         - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
       depends_on:
         - abs-node