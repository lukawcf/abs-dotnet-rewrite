   services:
     abs-node:
       image: ghcr.io/advplyr/audiobookshelf:latest
       environment:
         - TZ=Pacific/Auckland
         - JWT_SECRET_KEY=${JWT_SECRET_KEY}
       volumes:
         - ./library:/audiobooks
         - ./config:/config
         - ./metadata:/metadata
     abs-dotnet:
       build:
         context: .
         dockerfile: src/Abs.Api/Dockerfile
       environment:
         - JWT_SECRET_KEY=${JWT_SECRET_KEY}
       volumes:
         - ./config:/config:ro
       depends_on:
         - abs-node
     nginx:
       image: nginx:stable
       ports:
         - "8080:80"
       volumes:
         - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
       depends_on:
         - abs-node
         - abs-dotnet